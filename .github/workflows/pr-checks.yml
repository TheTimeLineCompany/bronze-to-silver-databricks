# Checks for every change to the framework (maintainers). Workers do not commit; their project folders are not here.
name: pr-checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-ci.txt
      - name: Tests (store, steps, checkpoints, models, viewer, baseline, documents, STTM, build, release, plug-ins)
        run: python -m pytest
      - name: Walkthrough of the fake application, bronze to handoff
        run: python -m b2s.demo.walkthrough "$RUNNER_TEMP/demo"
